backend:
  name: git-gateway
  branch: main

media_folder: 'public/media'
public_folder: '/media'

collections:
  - name: 'page'
    label: 'Website pages'
    folder: 'src/data/page'
    create: true
    nested:
      depth: 3
      summary: '{{title}}'
    fields:
      - { label: 'Page title', name: 'title', widget: 'string' }
      - {
          label: 'Archived source (reference only)',
          name: 'source',
          widget: 'string',
          required: false,
          hint: 'Leave this unchanged.',
        }
      - { label: 'Content', name: 'body', widget: 'markdown' }
